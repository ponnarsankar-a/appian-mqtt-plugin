# hello-appian-plugin.properties
# =================================
# Internationalisation (i18n) labels for the Appian Plugin Test plug-in.
# This file is referenced by appian-plugin.xml via i18n-name-key attributes.
#
# To add additional locales, create parallel files e.g.:
#   hello-appian-plugin_fr.properties  (French)
#   hello-appian-plugin_de.properties  (German)
#
# Keys are arbitrary — just ensure they match what you reference in appian-plugin.xml.

# ── Plugin-level labels ────────────────────────────────────────────────────────
plugin.name=Appian Plugin Test
plugin.description=Flexible Appian Suite Plug-in scaffold with Custom Function and Smart Service examples.

# ── Custom Function: helloWorld ────────────────────────────────────────────────
function.helloWorld.name=helloWorld
function.helloWorld.description=Returns a greeting string for the given name.
function.helloWorld.param.name=name
function.helloWorld.param.name.description=The name of the person to greet.

# ── Smart Service: Hello World Smart Service ───────────────────────────────────
smartservice.helloWorld.name=Hello World Smart Service
smartservice.helloWorld.description=Demonstrates a simple Smart Service with one input and two outputs.
smartservice.helloWorld.input.name=Name
smartservice.helloWorld.input.name.description=The name of the person to greet. (Required)
smartservice.helloWorld.output.greeting=Greeting
smartservice.helloWorld.output.greeting.description=The generated greeting string.
smartservice.helloWorld.output.success=Success
smartservice.helloWorld.output.success.description=True if the smart service completed without errors.
